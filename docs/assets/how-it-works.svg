<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">How Wireflow works</title>
<desc id="d">Three animated steps: drag a screen template from the sidebar onto the canvas, connect two screens by dragging from a handle, then save the diagram as wireflow.json while work autosaves in the browser.</desc>
<style>
.f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ln{fill:#BCC2C6}
.o{stroke:#34495E;stroke-width:1.2;stroke-linejoin:round}
.lbl{font-size:10px;font-weight:600;fill:#94A4A5}
.pb,.hl,.gh,.an,.anp,.dl,.rb,.pr,.fl{opacity:0}
.dl{fill:none;stroke:#22A6EF;stroke-width:1.6;stroke-dasharray:1 1}
.dn,.pr,.sv{transform-box:fill-box;transform-origin:center}
.cur{animation:cur 9s ease-in-out infinite}
.gh{animation:gh 9s ease-in-out infinite}
.dl{animation:dl 9s ease-in-out infinite}
.hl{animation:hl 9s linear infinite}.dn{animation:dn 9s ease-out infinite}
.anA{animation:anA 9s linear infinite}.anB{animation:anB 9s linear infinite}.anp{animation:anp 9s linear infinite}
.ed{animation:ed 9s linear infinite}.rb{animation:rb 9s linear infinite}
.pr{animation:pr 9s ease-out infinite}.fl{animation:fl 9s ease-out infinite}.fc{animation:fc 9s ease-out infinite}.sv{animation:sv 9s ease-in-out infinite}
.p1{animation:pa1 9s linear infinite}.p2{animation:pa2 9s linear infinite}.p3{animation:pa3 9s linear infinite}
@keyframes cur{0%{transform:translate(300px,170px);opacity:0}3%{transform:translate(300px,170px);opacity:1}7%,9%{transform:translate(70px,128px)}20%,22%{transform:translate(254px,120px)}29%,33.3%{transform:translate(300px,166px)}39%,40%{transform:translate(556px,104px)}50%,51%{transform:translate(644px,132px)}58%,66.7%{transform:translate(704px,188px)}72%,74%{transform:translate(856px,60px)}81%,94%{transform:translate(980px,138px);opacity:1}98%,100%{transform:translate(980px,138px);opacity:0}}
@keyframes gh{0%,8.5%{opacity:0;transform:translate(70px,128px)}9%{opacity:1;transform:translate(70px,128px)}20%{opacity:1;transform:translate(254px,120px)}21.5%,100%{opacity:0;transform:translate(254px,120px)}}
@keyframes hl{0%,8.5%{opacity:0}9.2%,21%{opacity:1}22%,100%{opacity:0}}
@keyframes dn{0%,20.5%{opacity:0;transform:scale(.9)}23%,94%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}
@keyframes anA{0%,37%{opacity:0}38.5%,51%{opacity:1}53%,100%{opacity:0}}
@keyframes anp{0%,39.5%{opacity:0}40.5%,51%{opacity:1}53%,100%{opacity:0}}
@keyframes anB{0%,45%{opacity:0}47%,51%{opacity:1}53%,100%{opacity:0}}
@keyframes dl{0%,40%{stroke-dashoffset:1;opacity:1}50%{stroke-dashoffset:0;opacity:1}51.5%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes ed{0%,50.5%{opacity:0}52.5%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes rb{0%,51%{opacity:0}52.5%,64%{opacity:1}66%,100%{opacity:0}}
@keyframes pr{0%,74%{opacity:0;transform:scale(1)}74.5%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.1)}}
@keyframes fl{0%,74.5%{opacity:0}75.5%{opacity:.8}79%,100%{opacity:0}}
@keyframes fc{0%,77%{opacity:0;transform:translateY(-12px)}80%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}
@keyframes sv{0%,82%{transform:scale(1)}84%{transform:scale(1.4)}86.5%,100%{transform:scale(1)}}
@keyframes pa1{0%{opacity:0}2%,31.5%{opacity:1}33.3%,100%{opacity:0}}
@keyframes pa2{0%,31.5%{opacity:0}33.3%,64.9%{opacity:1}66.7%,100%{opacity:0}}
@keyframes pa3{0%,64.9%{opacity:0}66.7%,96%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cur{display:none}}
</style>
<defs>
<pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d3d9df"/></pattern>
<g id="n"><rect x="0" y="2" width="96" height="88" rx="6" fill="#34495E" opacity=".07"/><rect x=".5" y=".5" width="95" height="87" rx="6" fill="#EBEFF0" stroke="#BCC2C6"/><rect x="5" y="19" width="86" height="64" rx="3" fill="#fff" stroke="#BCC2C6"/></g>
<g id="m"><rect x=".5" y=".5" width="63" height="55" rx="5" fill="#EBEFF0" stroke="#BCC2C6"/><rect x="4.5" y="4.5" width="55" height="47" rx="3" fill="#fff" stroke="#BCC2C6"/></g>
<g id="pn"><rect x=".5" y=".5" width="359" height="259" rx="12" fill="#fafbfc" stroke="#e1e5ea"/><rect x="12" y="12" width="336" height="168" rx="8" fill="#f0f2f5"/><rect x="12" y="12" width="336" height="168" rx="8" fill="url(#grid)"/></g>
<rect id="pbr" x="1" y="1" width="358" height="258" rx="11.5" fill="none" stroke="#22A6EF" stroke-width="2"/>
<path id="mt" d="M-11,7 L-3,-3 L2,3 L5,0 L11,7Z"/>
</defs>

<rect x=".5" y=".5" width="1199" height="299" rx="16" fill="#fff" stroke="#d8dee4"/>

<use href="#pn" x="24" y="20"/><use href="#pn" x="420" y="20"/><use href="#pn" x="816" y="20"/>
<use href="#pbr" x="24" y="20" class="pb p1"/><use href="#pbr" x="420" y="20" class="pb p2"/><use href="#pbr" x="816" y="20" class="pb p3"/>
<path d="M398,108l7,8l-7,8M794,108l7,8l-7,8" fill="none" stroke="#BCC2C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<g class="f">
  <g fill="#BCC2C6"><circle cx="54" cy="227" r="12"/><circle cx="450" cy="227" r="12"/><circle cx="846" cy="227" r="12"/></g>
  <g fill="#22A6EF"><circle class="p1" cx="54" cy="227" r="12"/><circle class="p2" cx="450" cy="227" r="12"/><circle class="p3" cx="846" cy="227" r="12"/></g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><text x="54" y="231.5">1</text><text x="450" y="231.5">2</text><text x="846" y="231.5">3</text></g>
  <g font-size="16" font-weight="600" fill="#34495E"><text x="76" y="233">Drag a screen</text><text x="472" y="233">Connect the flow</text><text x="868" y="233">Save >Export &amp; autosave<amp; autosave</text></g>
  <g font-size="13" fill="#6b7b8b"><text x="76" y="257">Pick from 100+ templates in the sidebar.</text><text x="472" y="257">Drag from a handle to link two screens.</text><text x="868" y="257">Save wireflow.json. Work autosaves locally.</text></g>
</g>

<!-- Step 1: sidebar + drop -->
<path d="M44,32H100V200H44Q36,200 36,192V40Q36,32 44,32Z" fill="#fff"/>
<path d="M100.5,32V200" stroke="#e1e5ea"/>
<rect x="44" y="40" width="48" height="10" rx="5" fill="#f0f2f5" stroke="#e1e5ea"/>
<g fill="#fff" stroke="#BCC2C6"><rect x="44.5" y="58.5" width="47" height="39" rx="3"/><rect x="44.5" y="106.5" width="47" height="39" rx="3"/><rect x="44.5" y="154.5" width="47" height="39" rx="3"/></g>
<rect class="o" x="50" y="64" width="36" height="16" rx="2" fill="#22A6EF"/>
<rect class="o" x="50" y="112" width="36" height="18" rx="2" fill="#39D4FF"/><use href="#mt" transform="translate(68,122) scale(.6)" class="o" fill="#22A6EF"/>
<g class="ln"><rect x="54" y="85" width="28" height="2.5" rx="1.25"/><rect x="54" y="135" width="28" height="2.5" rx="1.25"/><rect x="58" y="163" width="20" height="2.5" rx="1.25"/><rect x="52" y="170" width="32" height="5" rx="1.5" fill="none" stroke="#BCC2C6"/></g>
<rect class="o" x="59" y="180" width="18" height="6" rx="3" fill="#27CABF"/>
<rect class="hl" x="42" y="104" width="52" height="44" rx="4" fill="none" stroke="#22A6EF" stroke-width="2"/>

<g class="dn">
  <use href="#n" x="206" y="76"/><text class="f lbl" x="254" y="90" text-anchor="middle">Gallery Image</text>
  <rect class="o" x="212" y="101" width="74" height="34" rx="2" fill="#39D4FF"/><use href="#mt" transform="translate(249,121) scale(1.3)" class="o" fill="#22A6EF"/>
  <g fill="#BCC2C6"><circle cx="246" cy="142" r="1.8"/><circle cx="254" cy="142" r="1.8"/><circle cx="262" cy="142" r="1.8"/></g>
  <g class="ln"><rect x="226" y="149" width="56" height="3" rx="1.5"/><rect x="234" y="155" width="40" height="3" rx="1.5"/></g>
</g>
<g class="gh"><rect x="-48" y="-44" width="96" height="88" rx="6" fill="#22A6EF" fill-opacity=".08" stroke="#22A6EF" stroke-width="1.5" stroke-dasharray="5 4"/></g>

<!-- Step 2: connect -->
<use href="#n" x="460" y="60"/><text class="f lbl" x="508" y="74" text-anchor="middle">Sign In</text>
<g fill="#fff" stroke="#BCC2C6"><rect x="477.5" y="90.5" width="61" height="9" rx="2"/><rect x="477.5" y="105.5" width="61" height="9" rx="2"/></g>
<rect class="ln" x="477" y="120" width="24" height="3" rx="1.5"/>
<rect class="o" x="493" y="128" width="30" height="9" rx="4.5" fill="#27CABF"/>
<use href="#n" x="644" y="88"/><text class="f lbl" x="692" y="102" text-anchor="middle">Profile</text>
<circle class="o" cx="692" cy="126" r="11" fill="#39D4FF"/><circle class="o" cx="692" cy="123" r="4" fill="#fff"/>
<g class="ln"><rect x="670" y="144" width="44" height="3" rx="1.5"/><rect x="678" y="151" width="28" height="3" rx="1.5"/></g>
<rect class="o" x="678" y="158" width="28" height="8" rx="4" fill="#27CABF"/>

<g class="ed"><path d="M556,104H592Q600,104 600,112V124Q600,132 608,132H637" fill="none" stroke="#a4b2c0" stroke-width="2"/><path d="M644,132l-8,-4.5v9z" fill="#a4b2c0"/></g>
<rect class="rb" x="640" y="84" width="104" height="96" rx="9" fill="none" stroke="#22A6EF" stroke-width="2"/>
<g fill="#fff" stroke="#22A6EF" stroke-width="1.5">
  <g class="an anA"><circle cx="508" cy="60" r="3.5"/><circle cx="556" cy="104" r="3.5"/><circle cx="508" cy="148" r="3.5"/><circle cx="460" cy="104" r="3.5"/></g>
  <g class="an anB"><circle cx="692" cy="88" r="3.5"/><circle cx="740" cy="132" r="3.5"/><circle cx="692" cy="176" r="3.5"/><circle cx="644" cy="132" r="3.5"/></g>
</g>
<circle class="anp" cx="556" cy="104" r="4.5" fill="#22A6EF"/>
<path class="dl" pathLength="1" d="M556,104L644,132"/>

<!-- Step 3: export + autosave -->
<g fill="none" stroke="#a4b2c0" stroke-width="2"><path d="M964,92H981M1052,92H1069"/></g>
<g fill="#a4b2c0"><path d="M988,92l-8,-4.5v9zM1076,92l-8,-4.5v9z"/></g>
<use href="#m" x="900" y="64"/><use href="#m" x="988" y="64"/><use href="#m" x="1076" y="64"/>
<rect class="o" x="910" y="74" width="44" height="20" rx="2" fill="#22A6EF"/>
<g class="ln"><rect x="912" y="99" width="40" height="3" rx="1.5"/><rect x="918" y="105" width="28" height="3" rx="1.5"/></g>
<g class="o" fill="#39D4FF"><rect x="997" y="73" width="21" height="14" rx="1.5"/><rect x="1022" y="73" width="21" height="14" rx="1.5"/><rect x="997" y="92" width="21" height="14" rx="1.5"/><rect x="1022" y="92" width="21" height="14" rx="1.5" fill="#F19C1F"/></g>
<circle class="o" cx="1108" cy="86" r="10" fill="#27CABF"/><path d="M1103,86.5l3.5,3.5l6.5,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="ln" x="1092" y="102" width="32" height="3" rx="1.5"/>

<rect class="fl" x="828" y="32" width="336" height="168" rx="8" fill="#fff"/>
<circle class="pr" cx="856" cy="60" r="15" fill="none" stroke="#22A6EF" stroke-width="2"/>
<circle cx="856" cy="60" r="15" fill="#fff" stroke="#9aa5ae" stroke-width="1.2" stroke-dasharray="3 2.5"/>
<path d="M856,51.5V63M851,58.5l5,5l5,-5M849.5,65.5v2.5h13v-2.5" fill="none" stroke="#34495E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

<g class="fc f">
  <rect x="840.5" y="148.5" width="128" height="31" rx="8" fill="#fff" stroke="#d8dee4"/>
  <rect class="o" x="850" y="156" width="18" height="15" rx="2" fill="#39D4FF"/><use href="#mt" transform="translate(859,165) scale(.55)" class="o" fill="#22A6EF"/>
  <text x="876" y="168.5" font-size="12" font-weight="600" fill="#34495E">wireflow.json</text>
</g>
<g class="f">
  <rect x="1006.5" y="151.5" width="146" height="26" rx="13" fill="#e9f8f5" stroke="#bfe6dd"/>
  <g class="sv"><circle cx="1021" cy="164.5" r="7" fill="#27CABF"/><path d="M1017.5,164.8l2.4,2.4l4.4,-4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="1034" y="168.5" font-size="11.5" font-weight="600" fill="#1d8a76">Autosaved locally</text>
</g>

<g class="cur"><path d="M0,0V17.5L4.3,13.4L7.1,19.8L9.8,18.6L7,12.4H12.8Z" fill="#34495E" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></g>
</svg>
