# Only install releases that are at least 14 days old (in minutes), so a freshly
# published compromised version can't reach a lockfile. Exceptions, each a security
# release: next 16.3.8 fixes the critical/high advisories that affect 16.2.x (see
# README "Dependencies"); its own binaries and the OpenNext adapter that supports
# it follow it.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - '@opennextjs/*'
  - source-map-js

# Native binaries come from per-platform optional dependencies; their install
# scripts are only download fallbacks, so none of them needs to run.
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
  unrs-resolver: false

# Next.js only needs sharp for its image optimizer, which this app turns off
# (images.unoptimized), and Cloudflare Workers can't run it.
ignoredOptionalDependencies:
  - sharp

# Security fix (GHSA advisory 1241209, event-loop DoS); postcss pins an older 1.x.
overrides:
  source-map-js: 1.2.2
