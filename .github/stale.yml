# Configuration for the Probot Stale app (https://github.com/probot/stale).
#
# This file does nothing on its own: it only takes effect if the Probot Stale
# GitHub App is installed on this repository. It isn't today (no issue has
# ever been labelled "stale", and the repo has no such label). The app is
# deprecated in favour of the actions/stale workflow, which doesn't read this file.
#
# Auto-closing is intentionally off (daysUntilClose: false). The open issues
# were triaged by hand and many are kept open on purpose, so nothing here may
# close them. If the app is ever installed, it would at most label inactive
# issues "stale" with the comment below; they stay open.

# Number of days of inactivity before an issue becomes stale
daysUntilStale: 60

# Never close stale issues automatically (Probot Stale: "Set to false to
# disable. If disabled, issues still need to be closed manually, but will
# remain marked as stale.")
daysUntilClose: false

# Issues with these labels will never be considered stale
exemptLabels:
  - pinned
  - security

# Label to use when marking an issue as stale
staleLabel: stale

# Comment to post when marking an issue as stale. Set to `false` to disable
markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It stays open; a comment or any other activity removes the
  stale label. Thank you for your contributions.

# Comment to post when closing a stale issue: none, since nothing is closed
# automatically. (Probot Stale takes a string or false here.)
closeComment: false
